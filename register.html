<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Mina's Store </title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="products.html" class="logo">🛒 Mina's Store </a>
        <div class="nav-links">
            <a href="products.html">المنتجات</a>
            <a href="login.html">تسجيل الدخول</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>إنشاء حساب جديد</h2>
            
            <div id="error-msg" class="error-msg"></div>
            <div id="success-msg" class="success-msg"></div>
            
            <form onsubmit="register(event)">
                <div class="form-group">
                    <label for="name">الاسم الكامل</label>
                    <input type="text" id="name" placeholder="Full Name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="8 أحرف على الأقل + حرف كبير + رقم" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm" placeholder="أعد إدخال كلمة المرور" required>
                </div>
                
                <button type="submit" class="btn">إنشاء الحساب</button>
            </form>
            
            <div class="auth-link">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
