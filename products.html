<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات - Mina's Store </title>
    <link rel="stylesheet" href="css/style.css">
    <!-- مكتبة SheetJS للتعامل مع Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="products.html" class="logo">🛒 Mina's Store </a>
        <div class="nav-links">
            <span id="user-name" class="user-info" style="display:none;"></span>
            <a href="products.html">المنتجات</a>
            <a href="cart.html">السلة <span id="cart-count" class="cart-badge" style="display:none;">0</span></a>
            <a href="login.html" id="login-link">تسجيل الدخول</a>
            <a href="#" id="logout-btn" onclick="logout(); return false;" style="display:none;">تسجيل الخروج</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">منتجاتنا المميزة</h1>
        
        <!-- أزرار إدارة قاعدة البيانات (Excel) -->
        <div style="background:rgba(255,255,255,0.95); padding:15px 20px; border-radius:12px; margin-bottom:25px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center;">
            <button class="btn" style="width:auto; padding:10px 18px; font-size:0.95rem;" onclick="exportToExcel()">
                📥 تصدير إلى Excel
            </button>
            
            <label class="btn" style="width:auto; padding:10px 18px; font-size:0.95rem; background:#3498db; cursor:pointer;">
                📤 استيراد مستخدمين من Excel
                <input type="file" accept=".xlsx,.xls" onchange="importFromExcel(event)" style="display:none;">
            </label>
            
            <button class="btn" style="width:auto; padding:10px 18px; font-size:0.95rem; background:#e74c3c;" onclick="clearAllData()">
                🗑️ مسح كل البيانات
            </button>
        </div>

        <div id="products-grid" class="products-grid">
            <!-- Products will be rendered by JS -->
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
